/* Layout: one calm column like a dressing-room conversation. One question per screen with answers in the
   thumb zone; the gauge is the signature element on intro and result. */
/* Dark-first, matching metreagyano.nl (tokens taken from the site's CSS). Warn is orange, not gold, so "Let op" never reads as brand colour. */
:root {
  --bg: #0b0d0f; --surface: #161a1e; --ink: #f5f2eb; --muted: #aeb5ba; --line: #2a2f33;
  --accent: #c89a4f; --accent-soft: #241e14; --accent-ink: #111111; --gold: #e0ba74;
  --ok: #5BC98C; --warn: #F0954A; --bad: #EF6B5E; --ok-soft: #12251b; --warn-soft: #2b1f17; --bad-soft: #2e1a18;
  --display: "Archivo", Arial, Helvetica, sans-serif;
  --body: "Instrument Sans", Arial, Helvetica, sans-serif;
  --radius: 14px;
  color-scheme: dark;
}
/* Light palette for print/poster only; the tool itself stays dark like the brand. */
:root[data-theme="light"] {
  --bg: #F6F5F1; --surface: #FFFFFF; --ink: #111215; --muted: #5A5D63; --line: #DEDCD5;
  --accent: #7E6220; --accent-soft: #F3ECDD; --accent-ink: #FFFFFF; --gold: #C89A4F;
  --ok: #2F8F5B; --warn: #C8642A; --bad: #C9473A; --ok-soft: #E4F3EA; --warn-soft: #FBEBDD; --bad-soft: #FAE6E4;
  color-scheme: light; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; }
.wrap { max-width: 640px; margin: 0 auto; padding-block: 16px 48px; min-height: 100dvh; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { flex: 1; display: flex; flex-direction: column; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: clamp(2rem, 7vw, 2.8rem); font-weight: 800; }
h2 { font-size: clamp(1.35rem, 5vw, 1.7rem); font-weight: 800; }
h3 { font-size: 1.1rem; font-weight: 700; }
h2:focus, h1:focus { outline: none; }
p { margin: 0; }
a { color: var(--gold); }
.muted { color: var(--muted); }
.hint { font-size: .88rem; color: var(--muted); }
.eyebrow { font-family: var(--display); font-size: .75rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.stack { display: flex; flex-direction: column; gap: 18px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
.panel > .stack { gap: 14px; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* top bar */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 20px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 800; font-size: .98rem; white-space: nowrap; }
@media (max-width: 379px) { .brand span { display: none; } }
.brand svg { flex: none; }
.bar-right { display: flex; align-items: center; gap: 4px; }
.help-link { background: none; border: 0; color: var(--gold); font: 600 .88rem var(--body); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; min-height: 44px; padding: 0 6px; white-space: nowrap; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 0; background: var(--surface); }
.lang button { border: 0; background: transparent; color: var(--muted); font: 700 .8rem var(--body); min-width: 44px; min-height: 44px; border-radius: 999px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; cursor: pointer; text-decoration: none;
  font: 700 1rem var(--body); min-height: 48px; padding: 12px 22px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); }
.btn:hover { filter: brightness(1.06); }
.btn[disabled] { opacity: .4; cursor: not-allowed; filter: none; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid #343a3f; }
.btn.small { min-height: 44px; padding: 8px 14px; font-size: .9rem; }
.btn.block { width: 100%; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* question screens: progress on top, question, answers pushed down into the thumb zone */
.q-screen { flex: 1; display: flex; flex-direction: column; gap: 18px; }
.q-head { display: grid; gap: 10px; }
.q-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.back { background: none; border: 0; color: var(--muted); font: 600 .9rem var(--body); cursor: pointer; min-height: 44px; padding: 0; }
.count { font-family: var(--display); font-size: .82rem; font-weight: 700; color: var(--muted); }
.bar-progress { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar-progress span { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .2s ease; }
.q-body { display: grid; gap: 10px; }
.q-body h2 { font-size: clamp(1.3rem, 5.4vw, 1.65rem); }
.answers { display: grid; gap: 10px; padding-top: 12px; }
/* Thumb zone only on phones: on a laptop or tall monitor the answers stay right under the question. */
@media (max-width: 640px) and (pointer: coarse) { .answers { margin-top: auto; } }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 12px 16px; text-align: left; cursor: pointer;
  font: 600 1rem var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; transition: background .15s, border-color .15s; }
.opt:hover { border-color: #3d444a; }
.opt[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt .lvl { display: inline-flex; gap: 3px; flex: none; }
.opt .lvl i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .25; }
.opt .lvl i.on { opacity: 1; }

/* chips (multi-select sources) */
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; pointer-events: none; }
.chip span { display: inline-flex; align-items: center; min-height: 44px; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; }
.chip input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.chip input:focus-visible + span { outline: 3px solid var(--gold); outline-offset: 2px; }

/* intro */
.hero { display: grid; gap: 22px; }
.hero .lede { font-size: 1.08rem; max-width: 52ch; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; }
/* Like the badges on metreagyano.nl (silver-grey border, light grey text), one shade lighter than our black page. */
.fact { font-size: .85rem; padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 1px solid #394045; color: #d0d4d6; }
.gauge-card { display: grid; gap: 14px; justify-items: center; }
.legend { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
.legend div { display: grid; gap: 2px; font-size: .84rem; }
.legend b { font-family: var(--display); font-size: .95rem; display: flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
@media (max-width: 480px) { .legend { grid-template-columns: 1fr; } }

/* gauge */
.gauge { width: 100%; max-width: 300px; height: auto; display: block; }
.gauge .needle { transform-box: view-box; transform-origin: 120px 124px; transition: transform 1.1s cubic-bezier(.2,.9,.25,1.15); }
/* Result gauge: every band keeps its full colour (dimming orange and red turns them brown on black). The other
   bands are drawn thin; the own band grows to full width and glows as the needle lands (≈1 s), then the text appears. */
.gauge .seg.off { stroke-width: 6px; }
.gauge .seg.on { animation: seg-on .5s ease-out .95s both; filter: drop-shadow(0 0 5px var(--zone-c)); }
@keyframes seg-on { from { stroke-width: 6px; filter: none; } to { stroke-width: 16px; filter: drop-shadow(0 0 5px var(--zone-c)); } }

/* result: neutral card like the rest, the zone shows as a top line and a soft glow behind the gauge */
.zone { --zone-c: var(--ok); position: relative; isolation: isolate; overflow: hidden; border-radius: var(--radius); padding: 22px 18px;
  display: grid; gap: 14px; justify-items: center; text-align: center; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--zone-c); }
.zone.warn { --zone-c: var(--warn); } .zone.bad { --zone-c: var(--bad); }
.zone::before { content: ""; position: absolute; inset: 0; z-index: -1;
  background: radial-gradient(70% 50% at 50% 38%, color-mix(in srgb, var(--zone-c) 14%, transparent), transparent 72%); }
.zone p { animation: fade-in .4s ease-out 1.2s both; }
@keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.zone-tag { font: 800 .78rem var(--display); letter-spacing: .12em; text-transform: uppercase; padding: 6px 12px; border-radius: 999px; color: var(--surface); }
.zone p { max-width: 48ch; }

.sig-group { display: grid; gap: 8px; }
.sig-group + .sig-group { margin-top: 6px; }
.sig-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: .95rem; color: var(--muted); }
.sig-row.often { color: var(--ink); font-weight: 600; }
.dots { display: inline-flex; gap: 5px; flex: none; }
.dots i { width: 10px; height: 10px; border-radius: 50%; border: 1px solid #4a5157; }
.dots i.on { background: var(--muted); border-color: var(--muted); }
.often .dots i.on { background: var(--accent); border-color: var(--accent); }

.strategy { display: grid; gap: 10px; padding: 18px 0; border-top: 1px solid var(--line); }
.strategy:first-of-type { border-top: 0; padding-top: 2px; }
.strategy .num { font-family: var(--display); font-weight: 800; font-size: 1.4rem; color: var(--accent); line-height: 1; }
.todo { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin: 0; }
.todo dt { font: 800 .7rem var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); padding-top: 4px; }
.todo dd { margin: 0; min-width: 0; }

.recipients { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.recipients .label { font-size: .85rem; color: var(--muted); margin-right: 2px; }
.pill { min-height: 44px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: 600 .88rem var(--body); cursor: pointer; }
.pill[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
/* Editable message: looks like the quote block, but is a real text field you can change before sending. */
.msg { display: block; width: 100%; min-height: 7.5em; margin: 0; padding: 14px 16px; resize: vertical;
  font: 400 1rem/1.5 var(--body); color: var(--ink); background: #12171a;
  border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0; }
.msg:focus { outline: none; border-color: var(--gold); border-left-color: var(--accent); }
label.hint { margin-bottom: -6px; }
.copied { font-size: .85rem; color: var(--ok); }

.stat { display: flex; gap: 14px; align-items: flex-start; }
.stat .big { font-family: var(--display); font-weight: 800; font-size: 2.1rem; line-height: 1; color: var(--accent); flex: none; min-width: 3.2ch; }
.src { font-size: .8rem; color: var(--muted); }

.help.open { border-left: 4px solid var(--bad); }
.help ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.help li { display: grid; gap: 2px; }
.help .num { font-family: var(--display); font-weight: 800; font-size: 1.1rem; color: var(--ink); text-decoration: none; }
.help .num:hover { text-decoration: underline; }
details.help summary { cursor: pointer; font-weight: 600; min-height: 44px; display: flex; align-items: center; }
details.help[open] summary { margin-bottom: 12px; }

footer { margin-top: 40px; font-size: .8rem; color: var(--muted); display: grid; gap: 4px; }
footer a { color: inherit; }

/* dialogs: help sheet and plan card */
dialog { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--ink); padding: 20px; width: min(560px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); }
dialog::backdrop { background: rgba(7, 9, 10, .78); }
.dialog-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
.plan-card { aspect-ratio: 9 / 16; max-height: calc(100dvh - 180px); max-width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; padding: 24px 20px;
  border-radius: 18px; border: 1px solid #6d522a; background: linear-gradient(180deg, #161a1e 0%, #0b0d0f 100%); overflow: hidden; }
.plan-card h2 { font-size: 1.5rem; }
.plan-card .todo { gap: 10px 14px; font-size: 1.02rem; }
.plan-card .mark { margin-top: auto; display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 800; color: var(--accent); font-size: .9rem; }

/* screen transitions */
.enter { animation: enter .18s ease-out; }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

@media (prefers-reduced-motion: reduce) {
  .gauge .needle, .bar-progress span, .opt { transition: none; }
  .enter, .zone p, .gauge .seg.on { animation: none; }
}

</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12" fill="none" stroke="var(--accent)" stroke-width="2.5"/><path d="M14 14 L20 8" stroke="var(--gold)" stroke-width="2.5" stroke-linecap="round"/><circle cx="14" cy="14" r="2.2" fill="var(--ink)"/></svg>
      <span>Pressure Check</span>
    </div>
    <div class="bar-right">
      <button class="help-link" id="open-help" type="button"></button>
      <div class="lang" role="group" id="lang">
        <button id="lang-nl" type="button" aria-pressed="true">NL</button>
        <button id="lang-en" type="button" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>
  <main id="app"></main>
  <footer id="foot"></footer>
</div>
<div class="sr" aria-live="polite" id="live"></div>
<dialog id="help-dialog" aria-labelledby="help-dialog-h"></dialog>
<dialog id="plan-dialog" aria-labelledby="plan-dialog-h"></dialog>

<script>
// Pressure Check engine: pure functions over the answer state. No strings for display, only keys
// that src/content.*.js translates. Spec: docs/pressure-check-v2.1-plan.md §B1–B4, §B10.
//
// State shape:
//   { occupation: "vo"|"mbo"|"hbo"|"work"|"combo",
//     sources: ["study", ...],            // may contain "unknown" (exclusive)
//     heaviest: "study"|null,             // only asked when 2+ real sources
//     answers: [0..3 × 8],                // signal items in SIGNALS order
//     followups: { "sig.sleep": "late", "src.study": "planning", recipient: "friend", strength: "sport" } }
const Engine = (() => {
  // Item order is the tie-break order (plan §B3). Domain only groups rows on the signal card.
  const SIGNALS = [
    { id: "time", domain: "energy" },
    { id: "sleep", domain: "energy" },
    { id: "worry", domain: "head" },
    { id: "enough", domain: "head" },
    { id: "start", domain: "head" },
    { id: "body", domain: "body" },
    { id: "irritable", domain: "contact" },
    { id: "alone", domain: "contact" },
  ];
  const DOMAINS = ["energy", "head", "body", "contact"];
  const OCCUPATIONS = ["vo", "mbo", "hbo", "work", "combo", "other"];
  const SOURCES = ["study", "work", "sport", "home", "money", "future", "social", "self"];
  const RECIPIENTS = ["friend", "parent", "teacher", "coach", "other", "nobody"];
  const MESSAGE_RECIPIENTS = ["friend", "parent", "teacher", "coach"]; // "other" gets the friend-tone message
  const STRENGTHS = ["sport", "friends", "rest", "structure", "hobby", "other"];

  // Follow-up options per signal; `sport: true` options only appear when "sport" is a chosen source.
  // The "alone" signal's follow-up is the shared recipient question. Every question ends with "other" so
  // nobody has to pick an answer that isn't theirs; "other" leads to the generic advice.
  const SIGNAL_FOLLOWUPS = {
    time: [{ id: "study" }, { id: "job" }, { id: "sport", sport: true }, { id: "unclear" }, { id: "other" }],
    sleep: [{ id: "phone" }, { id: "worry" }, { id: "late" }, { id: "shift" }, { id: "other" }],
    worry: [{ id: "tests" }, { id: "perform" }, { id: "money" }, { id: "others" }, { id: "future" }, { id: "other" }],
    enough: [{ id: "self" }, { id: "parents" }, { id: "coach" }, { id: "peers" }, { id: "social" }, { id: "other" }],
    start: [{ id: "big" }, { id: "many" }, { id: "all" }, { id: "procrast" }, { id: "other" }],
    body: [{ id: "before" }, { id: "allday" }, { id: "evening" }, { id: "other" }],
    irritable: [{ id: "tired" }, { id: "home" }, { id: "work" }, { id: "perform" }, { id: "other" }],
  };
  const SOURCE_FOLLOWUPS = {
    sport: ["perform", "selection", "sideline", "mistake", "doubt", "injury", "fun", "combine", "other"],
    study: ["tests", "planning", "internship", "doubt", "other"],
    work: ["hours", "combine", "boss", "contract", "other"],
    home: ["conflict", "worry", "expect", "space", "other"],
    money: ["short", "work", "debt", "family", "other"],
    future: ["choice", "makeit", "housing", "world", "other"],
    social: ["compare", "stop", "fomo", "reactions", "other"],
    self: ["perfect", "fail", "compare", "rest", "other"],
  };
  // Sources with a full strategy per answer (plan §B5); the others share one strategy per source.
  const DETAILED_SOURCES = ["sport", "study", "self"];

  // Theme per strategy id: two strategies with the same theme never appear together (plan §B3).
  const THEMES = {
    "sig.time.study": "planning", "sig.time.job": "work-hours", "sig.time.sport": "recovery", "sig.time.unclear": "planning", "sig.time.generic": "energy-time",
    "sig.sleep.phone": "sleep", "sig.sleep.worry": "sleep", "sig.sleep.late": "sleep", "sig.sleep.shift": "sleep", "sig.sleep.generic": "sleep",
    "sig.worry.tests": "exam-prep", "sig.worry.perform": "sport-focus", "sig.worry.money": "money", "sig.worry.others": "selftalk", "sig.worry.future": "next-step", "sig.worry.generic": "worry-write",
    "sig.enough.self": "selftalk", "sig.enough.parents": "expectations-talk", "sig.enough.coach": "feedback", "sig.enough.peers": "compare", "sig.enough.social": "compare", "sig.enough.generic": "selftalk",
    "sig.start.big": "chunking", "sig.start.many": "prioritize", "sig.start.all": "prioritize", "sig.start.procrast": "chunking", "sig.start.generic": "chunking",
    "sig.body.before": "breathing", "sig.body.allday": "movement", "sig.body.evening": "relax", "sig.body.generic": "breathing",
    "sig.irritable.tired": "recovery", "sig.irritable.home": "pause", "sig.irritable.work": "pause", "sig.irritable.perform": "pause", "sig.irritable.generic": "pause",
    "sig.alone.friend": "support", "sig.alone.parent": "support", "sig.alone.teacher": "support", "sig.alone.coach": "support", "sig.alone.nobody": "support", "sig.alone.generic": "support",
    "src.sport.perform": "sport-focus", "src.sport.selection": "sport-control", "src.sport.sideline": "expectations-talk", "src.sport.mistake": "sport-reset",
    "src.sport.doubt": "selftalk", "src.sport.injury": "sport-control", "src.sport.fun": "motivation", "src.sport.combine": "planning", "src.sport.generic": "sport-control",
    "src.study.tests": "exam-prep", "src.study.planning": "planning", "src.study.internship": "next-step", "src.study.doubt": "next-step", "src.study.generic": "next-step",
    "src.self.perfect": "selftalk", "src.self.fail": "fear-fail", "src.self.compare": "compare", "src.self.rest": "recovery", "src.self.generic": "selftalk",
    "src.work": "work-hours", "src.home": "home-talk", "src.money": "money", "src.future": "next-step", "src.social": "screen",
    "strength": "strength",
  };

  // Zone thresholds (plan §B2). Tunable in one place; persona tests pin the behaviour.
  const ZONE = { highTotal: 15, highAlmostAlways: 3, watchTotal: 8, watchOften: 3, calmLowTotal: 3 };
  const MAX = SIGNALS.length * 3;

  const total = (s) => s.answers.reduce((a, b) => a + b, 0);
  const countAtLeast = (s, v) => s.answers.filter((a) => a >= v).length;
  const realSources = (s) => s.sources.filter((x) => x !== "unknown");
  const hasSport = (s) => s.sources.includes("sport");
  const signalScore = (s, id) => s.answers[SIGNALS.findIndex((x) => x.id === id)];

  function zoneOf(s) {
    const t = total(s);
    if (t >= ZONE.highTotal || countAtLeast(s, 3) >= ZONE.highAlmostAlways) return 2;
    if (t >= ZONE.watchTotal || countAtLeast(s, 2) >= ZONE.watchOften) return 1;
    return 0;
  }

  // "calm" = healthy, nothing often; "mild" = healthy with some frequent signals (plan §B10).
  function resultCase(s) {
    const z = zoneOf(s);
    if (z === 2) return "high";
    if (z === 1) return "watch";
    return countAtLeast(s, 2) === 0 ? "calm" : "mild";
  }

  // Signals that drive advice, highest first, ties by item order. With nothing often but zone
  // "watch" (many "sometimes"), the "sometimes" signals drive it instead.
  function rankedSignals(s) {
    const floor = countAtLeast(s, 2) === 0 && zoneOf(s) > 0 ? 1 : 2;
    return SIGNALS.map((x, i) => ({ id: x.id, score: s.answers[i], i }))
      .filter((x) => x.score >= floor)
      .sort((a, b) => b.score - a.score || a.i - b.i)
      .map((x) => x.id);
  }

  function heaviestSource(s) {
    const real = realSources(s);
    if (real.length === 0) return null;
    if (real.length === 1) return real[0];
    return real.includes(s.heaviest) ? s.heaviest : null;
  }
  const needsHeaviest = (s) => realSources(s).length >= 2;

  const signalQuestion = (id) => (id === "alone" ? "recipient" : `sig.${id}`);

  // Follow-up questions for step 4, in asking order (max 4; plan §B1).
  function nextQuestions(s) {
    if (resultCase(s) === "calm") {
      const src = heaviestSource(s);
      return ["strength", ...(src ? [`src.${src}`] : [])];
    }
    const qs = rankedSignals(s).slice(0, 2).map(signalQuestion);
    const src = heaviestSource(s);
    if (src) qs.push(`src.${src}`);
    if (!qs.includes("recipient") && (zoneOf(s) === 2 || signalScore(s, "alone") >= 2)) qs.push("recipient");
    return qs;
  }

  function optionsFor(qid, s) {
    if (qid === "recipient") return RECIPIENTS;
    if (qid === "strength") return STRENGTHS;
    const [kind, id] = qid.split(".");
    if (kind === "src") return SOURCE_FOLLOWUPS[id];
    return SIGNAL_FOLLOWUPS[id].filter((o) => !o.sport || hasSport(s)).map((o) => o.id);
  }

  // Variant when the follow-up was answered, otherwise the generic text for that signal.
  function signalStrategy(s, id) {
    const answer = s.followups[signalQuestion(id)];
    const valid = answer && (id === "alone" ? RECIPIENTS : SIGNAL_FOLLOWUPS[id].map((o) => o.id)).includes(answer);
    return `sig.${id}.${valid && answer !== "other" ? answer : "generic"}`;
  }

  function sourceStrategy(s) {
    const src = heaviestSource(s);
    if (!src) return null;
    if (!DETAILED_SOURCES.includes(src)) return `src.${src}`;
    const answer = s.followups[`src.${src}`];
    if (answer === "other") return `src.${src}.generic`;
    return SOURCE_FOLLOWUPS[src].includes(answer) ? `src.${src}.${answer}` : null;
  }

  // Strategy ids for the advice section (plan §B3, sharpened in §C3). "Hold on to what works" only
  // belongs to the calm case; elsewhere a theme clash leaves fewer, not padded, strategies.
  function pickStrategies(s) {
    const c = resultCase(s);
    const src = sourceStrategy(s);
    if (c === "calm") return ["strength", ...(src ? [src] : [])];

    const ranked = rankedSignals(s).filter((id) => !(c === "high" && id === "alone"));
    const sig = ranked.map((id) => signalStrategy(s, id));
    const priority = c === "high"
      ? [...(src ? [src] : []), ...sig]
      : [...sig.slice(0, 2), ...(src ? [src] : []), ...sig.slice(2)];
    const slots = c === "high" ? 2 : 3;

    const picked = [], themes = new Set();
    for (const id of priority) {
      if (picked.length === slots) break;
      if (themes.has(THEMES[id])) continue;
      picked.push(id);
      themes.add(THEMES[id]);
    }
    return picked;
  }

  const recipientOf = (s) => (RECIPIENTS.includes(s.followups.recipient) ? s.followups.recipient : null);
  const messageRecipient = (r) => (MESSAGE_RECIPIENTS.includes(r) ? r : "friend");

  // How the "talk" part of the result works (plan §B4, §B10):
  //   checkin = "Let op elkaar", message = personal message, support = support block (high zone).
  function talk(s) {
    const c = resultCase(s);
    const src = heaviestSource(s);
    const sportAnswer = s.followups["src.sport"];
    const topic = !src ? "generic" : src === "sport" && sportAnswer && sportAnswer !== "other" ? `sport.${sportAnswer}` : src;
    if (c === "high") return { mode: "support", recipient: messageRecipient(recipientOf(s)), anonymous: recipientOf(s) === "nobody", topic };
    if (c === "watch" || (c === "mild" && signalScore(s, "alone") >= 2)) {
      const r = recipientOf(s);
      return { mode: "message", recipient: messageRecipient(r), anonymous: r === "nobody", topic };
    }
    return { mode: "checkin" };
  }

  function helpList(s) {
    const first = { vo: "mentor", work: "workplace", other: "huisarts" }[s.occupation] || "studentsupport";
    const list = s.occupation === "vo"
      ? ["kindertelefoon", first, "113", "injebol", "huisarts", "112"]
      : [...new Set([first, "huisarts", "113", "injebol", "kindertelefoon", "112"])];
    if (zoneOf(s) < 2) return list;
    const urgent = s.occupation === "vo" ? ["113", "kindertelefoon", "injebol"] : ["113", "injebol"];
    return [...urgent, ...list.filter((x) => !urgent.includes(x))];
  }

  // Ordered result sections with display flags (plan §B10). "coach" (contact with Reagyano) always comes
  // after the help lines, never above them (plan §2b).
  function resultLayout(s) {
    const c = resultCase(s);
    const notAlone = { id: "notAlone", self: s.sources.includes("self") };
    const help = (open) => ({ id: "help", open, list: helpList(s) });
    if (c === "high") return [{ id: "zone" }, help(true), { id: "support" }, { id: "signals", compact: false }, { id: "advice" }, notAlone, { id: "coach" }, { id: "again" }];
    if (c === "watch") return [{ id: "zone" }, { id: "signals", compact: false }, { id: "advice" }, notAlone, { id: "talk" }, help(true), { id: "coach" }, { id: "again" }];
    return [{ id: "zone" }, { id: "signals", compact: c === "calm" }, { id: "advice" }, { id: "talk" }, help(false), { id: "coach" }, { id: "again" }];
  }

  // Everything the result screen needs, in one call.
  function result(s) {
    const t = total(s);
    return {
      zone: zoneOf(s), case: resultCase(s), total: t, max: MAX,
      calmLow: resultCase(s) === "calm" && t <= ZONE.calmLowTotal,
      often: countAtLeast(s, 2),
      ranked: rankedSignals(s),
      strategies: pickStrategies(s),
      talk: talk(s),
      layout: resultLayout(s),
    };
  }

  // Needle angle 0..1 inside the zone's own band, so the gauge can never contradict the zone (plan §B2).
  function gaugePosition(s) {
    const bands = [[0, ZONE.watchTotal - 1], [ZONE.watchTotal, ZONE.highTotal - 1], [ZONE.highTotal, MAX]];
    const z = zoneOf(s), [lo, hi] = bands[z];
    const within = Math.min(Math.max((total(s) - lo) / (hi - lo), 0), 1);
    return (z + 0.05 + within * 0.9) / 3; // keep clear of the band edges so the needle never sits on a boundary
  }

  // What is stored on the device for "last time" (plan §B2). Never stored in workshop mode (caller's job).
  const record = (s, date) => ({ zone: zoneOf(s), n2: countAtLeast(s, 2), d: date });

  // Every key the content files must provide, for the coverage test.
  function contentKeys() {
    const strategies = Object.keys(THEMES);
    const questions = [
      ...Object.keys(SIGNAL_FOLLOWUPS).map((id) => [`sig.${id}`, SIGNAL_FOLLOWUPS[id].map((o) => o.id)]),
      ...SOURCES.map((id) => [`src.${id}`, SOURCE_FOLLOWUPS[id]]),
      ["recipient", RECIPIENTS], ["strength", STRENGTHS],
    ];
    const topics = ["generic", ...SOURCES, ...SOURCE_FOLLOWUPS.sport.filter((a) => a !== "other").map((a) => `sport.${a}`)];
    return { strategies, questions, topics, signals: SIGNALS.map((x) => x.id), domains: DOMAINS, sources: SOURCES, occupations: OCCUPATIONS, recipients: RECIPIENTS, messageRecipients: MESSAGE_RECIPIENTS };
  }

  return {
    SIGNALS, DOMAINS, OCCUPATIONS, SOURCES, RECIPIENTS, STRENGTHS, THEMES, ZONE, MAX,
    zoneOf, resultCase, rankedSignals, heaviestSource, needsHeaviest, nextQuestions, optionsFor,
    pickStrategies, talk, helpList, resultLayout, result, gaugePosition, record, contentKeys,
  };
})();

if (typeof module !== "undefined") module.exports = Engine;

    hint: "Pick everything that fits. There's no right or wrong.",
    heaviestQ: "Which one weighs the most right now?",
    options: {
      study: "Study or school", work: "Work", sport: "Sport", home: "Home", money: "Money",
      future: "The future", social: "Social media", self: "Myself, my own expectations", unknown: "Not sure or something else",
    },
  },

  signals: {
    q: "What have you noticed in the last 7 days?",
    hint: "Go with your gut. Your first answer is usually the best one.",
    scale: ["Never", "Sometimes", "Often", "Almost always"],
    items: {
      time: { q: "I have no time left for things that give me energy, like sport, hobbies or friends.", name: "No time for energy" },
      sleep: { q: "I sleep worse or less than usual.", name: "Poor sleep" },
      worry: { q: "I keep worrying about what I still need to do or what could go wrong.", name: "Worrying" },
      enough: { q: "I feel like what I do is never good enough.", name: "Never good enough" },
      start: { q: "I dread what's coming and don't know where to start.", name: "Not knowing where to start" },
      body: { q: "I notice tension in my body, like headaches, stomach aches or tight muscles.", name: "Tension in your body" },
      irritable: { q: "I get irritated or snap at people more easily.", name: "Snapping at people" },
      alone: { q: "I try to solve everything myself and don't ask anyone for help.", name: "Doing it all alone" },
    },
  },

  domains: { energy: "Energy", head: "Mind", body: "Body", contact: "Connection" },

  followups: {
    "sig.time": { q: "Where does most of your time go?", options: { study: "School or studying", job: "Work or side job", sport: "Training and matches", unclear: "Not really sure", other: "Something else" } },
    "sig.sleep": { q: "What keeps you awake the most?", options: { phone: "Phone or scrolling", worry: "Worrying in bed", late: "Working or studying late", shift: "Late training or shifts", other: "Something else" } },
    "sig.worry": { q: "What do you worry about the most?", options: { tests: "Tests and deadlines", perform: "Matches or performing", money: "Money", others: "What others think of me", future: "The future", other: "Something else" } },
    "sig.enough": { q: "Whose judgement weighs the most?", options: { self: "My own", parents: "My parents'", coach: "My teacher's or coach's", peers: "Teammates' or friends'", social: "Social media's", other: "Something else" } },
    "sig.start": { q: "What does it look like?", options: { big: "One big deadline", many: "Lots of small tasks", all: "Everything at once", procrast: "I keep putting things off", other: "Something else" } },
    "sig.body": { q: "When do you notice it most?", options: { before: "Before tests or matches", allday: "All day", evening: "In the evening or in bed", other: "Something else" } },
    "sig.irritable": { q: "When does it mostly happen?", options: { tired: "When I'm tired", home: "At home", work: "At training or work", perform: "When I have to perform", other: "Something else" } },
    recipient: { q: "Who do you find it easiest to talk to?", options: { friend: "A friend", parent: "A parent", teacher: "Teacher or mentor", coach: "Coach or trainer", nobody: "Nobody, really", other: "Someone else" } },
    strength: { q: "What helps you most to handle pressure right now?", options: { sport: "Sport or exercise", friends: "Time with friends", rest: "Enough rest and sleep", structure: "A fixed routine", hobby: "A hobby", other: "Something else" } },
    "src.sport": { q: "What gives you the most pressure in your sport?", options: { perform: "Performing in matches", selection: "Selection or a starting spot", sideline: "Coach or parents on the sideline", mistake: "Getting stuck after a mistake", doubt: "Doubting myself", injury: "Injury or sitting on the bench", fun: "The fun is gone", combine: "Combining sport with school or work", other: "Something else" } },
    "src.study": { q: "What's going on most with your studies?", options: { tests: "Tests or resits", planning: "Planning", internship: "Internship or graduating", doubt: "Doubts about my studies", other: "Something else" } },
    "src.work": { q: "What's going on most at work?", options: { hours: "Too many hours", combine: "Combining work with studying", boss: "Pressure from my manager", contract: "Uncertainty about my contract", other: "Something else" } },
    "src.home": { q: "What's going on most at home?", options: { conflict: "Arguments or tension", worry: "Worrying about someone", expect: "My parents' expectations", space: "Little peace or space", other: "Something else" } },
    "src.money": { q: "What's going on most with money?", options: { short: "I have too little left", work: "Working a lot to get by", debt: "A debt or loan", family: "Money worries at home", other: "Something else" } },
    "src.future": { q: "What's on your mind most about the future?", options: { choice: "Which study or job", makeit: "Whether I'll make it", housing: "Living on my own", world: "The world in general", other: "Something else" } },
    "src.social": { q: "What does social media do to you?", options: { compare: "I compare myself", stop: "I can't stop", fomo: "I'm afraid of missing out", reactions: "Other people's reactions", other: "Something else" } },
    "src.self": { q: "What do you recognise most?", options: { perfect: "I want to do it perfectly", fail: "I'm afraid of failing", compare: "I compare myself to others", rest: "I don't allow myself rest", other: "Something else" } },
  },

  strategies: {
    "sig.time.generic": { t: "Plan one fixed moment for yourself", w: "In busy weeks, the things that give you energy are the first to disappear.", d: "Put one 30 minute slot in your calendar today for something that recharges you.", k: "Keep that slot free twice this week. Treat it like an appointment you don't move." },
    "sig.time.study": { t: "Give your studying an end time", w: "Without an end time, studying takes over everything, including your rest.", d: "Pick a fixed end time for your study work today. Then put 30 minutes for yourself in your calendar.", k: "Stick to that end time on three days this week. At the end of the week, notice what it gave you." },
    "sig.time.job": { t: "Check your hours", w: "Work often costs more than you think, especially rest.", d: "Add up today how many hours you work, study and travel this week. Write it on one note.", k: "Is it too much? Ask for one shift less or one fixed free evening this week." },
    "sig.time.sport": { t: "Protect your rest day", w: "Top athletes plan their rest too. Recovery is part of training.", d: "Pick one fixed rest day in your week today and put it in your calendar.", k: "Keep that one day free of extra training and work this week. Tell your coach you're doing this." },
    "sig.time.unclear": { t: "See where your time goes", w: "If you don't know where your time goes, you can't change anything about it.", d: "Tonight, spend 10 minutes writing down what you did each hour today.", k: "Do this on three days this week. Then pick one thing to do less of." },

    "sig.sleep.generic": { t: "Protect your sleep", w: "Bad sleep makes everything heavier, including the pressure itself.", d: "Tonight, stop work, studying and your phone 30 minutes before sleep.", k: "Get up around the same time every day this week, also at the weekend." },
    "sig.sleep.phone": { t: "Phone out of reach", w: "Scrolling keeps your mind switched on, even when you're tired.", d: "Tonight, put your phone somewhere you can't reach from your bed.", k: "Do this on five evenings this week. Notice whether you fall asleep faster." },
    "sig.sleep.worry": { t: "Empty your head before bed", w: "In bed, everything that had no place during the day comes back.", d: "Tonight, spend 10 minutes before sleep writing down everything on your mind.", k: "Do this every evening this week. Put the paper away and tell yourself: more tomorrow." },
    "sig.sleep.late": { t: "Pick a hard stop time", w: "Working late feels productive, but your sleep pays the bill.", d: "Pick a stop time today, for example 10 pm. Set an alarm for it.", k: "Stick to your stop time on five evenings this week. Whatever isn't done, you plan for the next day." },
    "sig.sleep.shift": { t: "Switch off after a late training or shift", w: "After a late training or shift your body is still switched on. So you fall asleep later.", d: "Pick a 15 minute wind-down routine today. For example a shower, a small snack and no screen.", k: "Do it after every late training or shift this week. Late more than three times? Then talk about your schedule." },

    "sig.worry.generic": { t: "Get it out of your head", w: "Worrying costs energy without solving anything.", d: "Today, write down everything on your mind. Next to each point, write: can I do something about this myself?", k: "Every day this week, pick one point you do have influence on. Do something small about it." },
    "sig.worry.tests": { t: "Make your {taak} smaller", w: "Worrying about a {taak} is often about everything at once. A plan makes it manageable.", d: "Today, write down what needs to be done for your next {taak}. Pick the part you dread most.", k: "Work on exactly that part three times for 25 minutes this week." },
    "sig.worry.perform": { t: "Focus on what you control", w: "Before a match you often worry about the result. That's not in your hands.", d: "Today, write down three things you control yourself. For example your effort, your attitude and your first action.", k: "Read those three points before your next two trainings or matches. After a mistake, pick your next action straight away." },
    "sig.worry.money": { t: "Turn money worries into a plan", w: "Money worries get bigger in your head than on paper.", d: "Today, write down your three biggest money worries. Next to each, write one step you can take.", k: "Take one of those steps this week. For example sort out a payment or ask your municipality for free money advice." },
    "sig.worry.others": { t: "Check your thought", w: "You usually don't know what others think of you. Your mind fills it in.", d: "Today, write down one thought about what others think of you. Next to it, write: what do I know for sure?", k: "Do this three times this week when you notice you're worrying about it." },
    "sig.worry.future": { t: "Pick the smallest next step", w: "The future is too big to solve in one go.", d: "Today, write down which choice is on your mind. What's the smallest step you can take?", k: "Take that one step this week. For example send one email, pick one open day or plan one conversation." },

    "sig.enough.generic": { t: "What would you tell a friend?", w: "The strictest voice is often your own.", d: "Today, write down the critical thought you have about yourself. Below it, write what you'd tell a good friend.", k: "Do this three times this week when you notice you're being hard on yourself." },
    "sig.enough.self": { t: "Decide in advance what's good enough", w: "If your own bar keeps rising, nothing is ever finished.", d: "Pick one task today. Write down in advance when it's good enough.", k: "Do this for three tasks this week. Stop when you reach your own line, even if it could be better." },
    "sig.enough.parents": { t: "Check the expectations", w: "You often think you know what your parents expect. Sometimes it's less than you think when you ask.", d: "Today, write down what you think your parents expect of you.", k: "Ask one parent this week: is this right, or do you expect something else?" },
    "sig.enough.coach": { t: "Ask for concrete feedback", w: "Without clear feedback, you fill in what your coach or teacher thinks. Usually harsher than it is.", d: "Today, write down one question: what's going well, and what's one point to work on?", k: "Ask your coach or teacher that question this week. Then work on that one point." },
    "sig.enough.peers": { t: "Compare with yourself, not with them", w: "With others you only see the outside. With yourself you see everything.", d: "Today, write down three things you do better now than a year ago.", k: "Notice yourself comparing this week? Then write down one bit of your own progress. Do this at least three times." },
    "sig.enough.social": { t: "Compare less on your screen", w: "On social media you see other people's highlights next to your ordinary day.", d: "Today, set a 30 minute limit on the app where you compare yourself most.", k: "Unfollow five accounts that make you feel worse this week." },

    "sig.start.generic": { t: "Make it smaller", w: "A pile of work feels bigger when you don't know where to start.", d: "Today, pick the task that matters most. Write down the first step that fits in 25 minutes.", k: "Work in 25 minute blocks with 5 minute breaks this week. Start each day with the hardest block." },
    "sig.start.big": { t: "Cut your {taak} into pieces", w: "One big {taak} feels like a mountain. Small steps feel like a plan.", d: "Today, write down all the steps up to your {taak}. Make each step small enough for 25 minutes.", k: "Take at least one step every day this week. Cross it off when it's done." },
    "sig.start.many": { t: "Pick your top 3", w: "Lots of small tasks together feel like one mountain. Then you can't see what matters.", d: "Today, write down all your tasks. Put a star next to the three that matter most.", k: "Start every day this week with a top 3. The rest is a bonus." },
    "sig.start.all": { t: "Must, later or drop", w: "When everything comes at once, it all seems equally important. It isn't.", d: "Today, put every task in one of three lists: must do this week, can wait, can go.", k: "This week, only work on the 'must' list. Drop at least one task from 'can go'." },
    "sig.start.procrast": { t: "Start with two minutes", w: "Putting things off is often not about being lazy. Starting just feels heavier than carrying on.", d: "Today, pick one task you keep putting off. Work on it for two minutes. Then you're allowed to stop.", k: "Do one two-minute start every day this week. Often you'll just keep going." },

    "sig.body.generic": { t: "Breathe out slowly", w: "Tension in your body drops faster when you breathe out slowly.", d: "Today, breathe in for 4 counts and out for 6 for three minutes. Do it right now.", k: "Do this once a day this week, at a fixed moment." },
    "sig.body.before": { t: "Make a fixed routine for the moment", w: "Before a test or match your body says: this matters. A routine helps you steer that.", d: "Today, come up with a 3 minute routine: 4 counts in, 6 counts out, and one sentence for yourself.", k: "Practise that routine three times this week, even when nothing exciting is coming. Use it before your next test or match." },
    "sig.body.allday": { t: "Move the tension out", w: "If you're tense all day, your body never gets a moment's rest.", d: "Today, walk outside for 10 minutes without your phone in your hand.", k: "Plan a 10 minute moment to move every day this week." },
    "sig.body.evening": { t: "Relax before sleep", w: "In the evening the distractions fall away. That's when you notice how tense you are.", d: "Tonight in bed, tense your muscles for 5 counts and let go. Start at your feet and end at your shoulders.", k: "Do this exercise on five evenings this week." },

    "sig.irritable.generic": { t: "Take a step back", w: "Snapping at people is often a sign your bucket is full.", d: "Notice yourself getting irritated today? Take a 5 minute break and breathe in for 4 counts and out for 6.", k: "Notice when it happens this week. Write it down three times: what time, and during which task?" },
    "sig.irritable.tired": { t: "Recharge first", w: "When you're tired, your fuse is shorter. That's not the other person's fault.", d: "Take 15 minutes of real rest today, without a screen.", k: "Go to bed half an hour earlier on three evenings this week." },
    "sig.irritable.home": { t: "Make a pause button at home", w: "At home there's little room to cool down. So things escalate faster.", d: "Agree with yourself today: when it escalates, I say 'back in a minute' and walk away for 5 minutes.", k: "Use that pause button every time you need it this week. Then carry on talking calmly." },
    "sig.irritable.work": { t: "A short break at training or work", w: "At training or work you keep going, even when you're full. A short break keeps you sharp.", d: "Today, pick a fixed moment for a 2 minute break during your training or shift.", k: "Take that break at every training or shift this week. Things escalating? Tell your coach or manager." },
    "sig.irritable.perform": { t: "From irritation to focus", w: "Pressure to perform can come out as irritation towards others.", d: "Today, come up with one word you say when you feel irritated. For example 'reset' or 'next'.", k: "Use that word at every training or test this week. Then pick your next action straight away." },

    "sig.alone.generic": { t: "Tell one person", w: "Wanting to do it all alone feels strong, but often makes the pressure bigger.", d: "Today, send a message to someone you trust. Further down you'll find a text you can use.", k: "Ask for one concrete thing this week: to listen, to think along or to do something together." },
    "sig.alone.friend": { t: "Tell a friend", w: "Wanting to do it all alone feels strong, but often makes the pressure bigger.", d: "Today, send a message to a friend. Further down you'll find a text you can use.", k: "Ask for one concrete thing this week: to listen, to think along or to do something together." },
    "sig.alone.parent": { t: "Tell someone at home", w: "Parents often notice less than you think. If you say it, they can help.", d: "Today, ask if you can talk to your parent for 10 minutes tonight. Further down you'll find a message.", k: "Ask for one concrete thing this week: to listen, to think along or to take something off your plate." },
    "sig.alone.teacher": { t: "Tell your mentor or teacher", w: "Your mentor or teacher can often arrange more than you think.", d: "Today, send your mentor or teacher a short message. Further down you'll find a text you can use.", k: "Set up one conversation this week. Bring one question: what can I do first?" },
    "sig.alone.coach": { t: "Tell your coach", w: "A good coach wants to know what's going on. Off the pitch too.", d: "Today, ask if you can talk to your coach briefly after training. Further down you'll find a message.", k: "In that conversation this week, say what's going on. Ask your coach to think along about your planning." },
    "sig.alone.nobody": { t: "Start anonymously", w: "You don't need to know anyone yet. Talking to a stranger is sometimes easier.", d: "Today, chat for 10 minutes with In je bol or De Kindertelefoon. It's free and anonymous.", k: "This week, think of one person you could tell a little bit to." },

    "src.sport.perform": { t: "Play the action, not the result", w: "Pressure in matches is often about the result. You only control your next action.", d: "Today, pick one process goal for your next match. For example: call for every ball, or encourage after every mistake.", k: "After your next match, judge yourself only on that goal. Give yourself a score from 1 to 10." },
    "src.sport.selection": { t: "Focus on what you control", w: "The coach decides who gets selected. You decide your effort and attitude.", d: "Today, write down what you control and what you don't. Consciously put the 'don't' list aside.", k: "Pick two things from your 'do' list this week. Show them at every training." },
    "src.sport.sideline": { t: "Talk about the sideline", w: "A coach or parents on the sideline often mean well. Still, it can feel like extra pressure.", d: "Today, write down what you like to hear from the sideline, and what you don't.", k: "Tell that person this week. Do it calmly and away from the match." },
    "src.sport.mistake": { t: "From mistake to next action", w: "Getting stuck on a mistake costs you the next action. A reset gets you back in the game.", d: "Today, pick a reset for after a mistake. For example clap your hands, breathe out and say 'next'.", k: "Use that reset at every training this week. Count how often it works." },
    "src.sport.doubt": { t: "Build proof for yourself", w: "Doubt only remembers what went wrong. Confidence grows when you also keep what went well.", d: "Today, write down three actions from your last training or match that went well.", k: "After every training this week, write down one thing that went well. Read them back before your match." },
    "src.sport.injury": { t: "Keep your goal, change your route", w: "An injury or sitting on the bench feels like standing still. Still, you can work on what you control.", d: "Today, pick one thing you can work on now. For example your recovery, your game sense or supporting your team.", k: "Work on it three times this week. Ask your coach or physio what's realistic." },
    "src.sport.fun": { t: "Find back what you enjoyed", w: "When the fun disappears, every training feels like an obligation. Then the pressure grows.", d: "Today, write down why you once started your sport. What did you enjoy most back then?", k: "Twice this week, do something in your sport just for fun. Tell your coach what you notice." },
    "src.sport.combine": { t: "Plan sport and school as one week", w: "Planning sport and school or work separately causes clashes. One overview gives calm.", d: "Today, put all your trainings, classes and shifts for this week in one schedule.", k: "Plan two fixed study blocks between your trainings this week. Stick to both." },
    "src.sport.generic": { t: "Pick your next action", w: "Pressure in your sport feels big when you want to solve everything at once. You only control your next action.", d: "Today, write down what gives you the most pressure in your sport. Next to it, write: what do I control here?", k: "Pick one thing you control this week. Work on it at every training." },

    "src.study.tests": { t: "Study smart for your {taak}", w: "Rereading feels like studying, but testing yourself works better.", d: "Today, write five practice questions about the material for your next {taak}.", k: "Test yourself three times with those questions this week. Then only study what you still got wrong." },
    "src.study.planning": { t: "Plan your week in blocks", w: "Without a plan, everything feels equally urgent. With a plan you see what can wait.", d: "Today, list your deadlines for the next two weeks.", k: "Plan one fixed 50 minute study block in your calendar every day this week." },
    "src.study.internship": { t: "Make your internship or graduation concrete", w: "A big final product feels unclear. With in-between steps you see where you stand again.", d: "Today, write down the next three steps for your internship or graduation.", k: "Finish at least one step this week. Plan a short meeting with your supervisor." },
    "src.study.doubt": { t: "Explore your doubt", w: "Doubt about your studies sticks around when you only think about it in your head.", d: "Today, write down three things you like about your studies, and three you don't.", k: "Plan a conversation about your doubt with your mentor, counsellor or study coach this week." },
    "src.study.generic": { t: "Make your study pressure concrete", w: "Study pressure feels bigger while it's a cloud in your head. On paper it becomes a list.", d: "Today, write down in one sentence what's hardest about your studies right now.", k: "Talk about it with a teacher, mentor or fellow student this week." },

    "src.self.perfect": { t: "Choose good enough", w: "Perfect doesn't exist. If you want perfect, you hardly ever finish anything.", d: "Pick one task today and agree with yourself: 80 percent is good enough.", k: "Do this for three tasks this week. Notice what happens: usually nobody sees the difference." },
    "src.self.fail": { t: "Look your fear in the eye", w: "Being afraid of failing makes you careful. Then you dare less than you can.", d: "Today, write down: what's the worst that could happen? And what would you do then?", k: "This week, do one small thing you dread. For example ask a question in class or at training." },
    "src.self.compare": { t: "Your bar, not someone else's", w: "You compare your own inside with other people's outside.", d: "Today, write down where you want to be in six months. Just you, without others.", k: "Look at your own progress three times this week. What went better than last month?" },
    "src.self.rest": { t: "Rest is work too", w: "Top athletes plan their rest too. Without recovery you don't get better, just more tired.", d: "Put a 30 minute rest moment in your calendar today. Without feeling guilty.", k: "Take two of those moments this week. Notice how you feel afterwards." },
    "src.self.generic": { t: "Be your own coach", w: "The bar you set for yourself is one you can move yourself.", d: "Today, write down what you expect of yourself. Next to it, write: would I expect this of a friend?", k: "Make one expectation more realistic this week. Notice how that feels." },

    "src.work": { t: "Make your work manageable", d: "Today, write down what your work costs you this week: hours, energy and travel time.", k: "Pick one thing to discuss with your manager or change in your schedule this week." },
    "src.home": { t: "Make home something you can talk about", d: "Today, write down in one sentence what's hardest at home.", k: "Talk about it with one person this week: at home, at school or at a helpline." },
    "src.money": { t: "Get your money in order", d: "Today, spend 15 minutes writing down what comes in and goes out this month.", k: "Pick one expense to cut this week. Can't make ends meet? Ask your school or municipality for free money advice." },
    "src.future": { t: "Make your future smaller", d: "Today, write down which choice about your future is on your mind most.", k: "Take one small step this week. For example pick an open day, ask someone for advice or read one job ad." },
    "src.social": { t: "Put a lock on your screen", d: "Today, check in your settings how much time you spend on social media per day. Set a limit.", k: "Put your phone away for one hour every day this week, at a fixed time." },

    strength: { t: "Hold on to what works", w: "You're doing well right now. It helps to know why.", d: "Today, write down what helps you handle the pressure this week.", k: "Give what helps you a fixed place in your calendar at least twice this week." },
  },

  sourceWhy: {
    work: { hours: "Working too many hours eats into your rest and your studies.", combine: "Work and studying both pull at the same hours.", boss: "Pressure from a manager feels bigger when you don't talk about it.", contract: "Uncertainty about your contract keeps your mind busy, also outside work.", other: "Work pressure creeps in when you don't stop to think about it." },
    home: { conflict: "You take arguments or tension at home everywhere you go.", worry: "Worrying about someone at home feels heavy when you carry it alone.", expect: "Parents' expectations can feel like a bar that keeps rising.", space: "Without peace or space at home, you can never really recover.", other: "What's going on at home, you also feel at school, work and training." },
    money: { short: "Having too little left gives you a bit of stress every day.", work: "Working a lot to get by costs time you also need for rest.", debt: "A debt or loan stays in the back of your mind.", family: "You feel money worries at home too, even when they're not yours.", other: "Money matters stay in the back of your mind, even when you're not thinking about them." },
    future: { choice: "A choice about study or work feels big, as if you need to get it right in one go.", makeit: "Doubting whether you'll make it costs energy you need to make it.", housing: "Living on your own is a big step with a lot of unknowns.", world: "Worries about the world are real, but you don't have to carry them alone.", other: "Thinking about your future costs energy, especially when it stays vague." },
    social: { compare: "Comparing yourself online makes your own life seem smaller than it is.", stop: "If you can't stop scrolling, your time and rest slip away unnoticed.", fomo: "Being afraid of missing out keeps you always 'on'.", reactions: "Other people's reactions online can stick with you for a long time.", other: "Social media often costs more time and energy than you notice." },
  },

  strengthPlan: {
    sport: { d: "Today, write down when you'll do sport or exercise this week.", k: "Keep at least two of those moments free this week, even if things get busier." },
    friends: { d: "Today, make a plan with a friend for this week.", k: "See someone you feel good with at least twice this week." },
    rest: { d: "Pick a fixed bedtime for this week today.", k: "Stick to that bedtime on at least five evenings this week." },
    structure: { d: "Today, put your most important tasks for this week in your calendar.", k: "Look at your plan for 5 minutes every morning this week." },
    hobby: { d: "Put a moment for your hobby in your calendar today.", k: "Give your hobby a fixed place at least twice this week." },
  },

  zoneNames: ["Healthy tension", "Watch out", "Overloaded"],
  zoneShort: ["You're keeping it in balance.", "Signs that pressure is taking over.", "Many signals at once. Time for support."],
  zoneText: {
    calmLow: "You notice little pressure right now. Nice. Know what helps you with that, so you can hold on to it.",
    calm: "You sometimes notice some tension, but nothing often. You're keeping it well in balance.",
    mild: "You're keeping it in balance, but you notice a few signals often. You can do something about those now.",
    watch: "There are signs that pressure is starting to take over. Adjusting now is a lot easier than waiting.",
    high: "You're noticing a lot of signals at once. That's heavy, and you don't have to solve it alone. Talk to someone about it this week.",
  },

// Pressure Check UI. Screens are derived from the answer state; Engine decides what is asked and shown,
// CONTENT_NL / CONTENT_EN hold every text. Nothing leaves the device (plan §B6).
const TEXT = { nl: CONTENT_NL, en: CONTENT_EN };
const params = new URLSearchParams(location.search);
const WORKSHOP = params.get("mode") === "workshop";
const KEY_LAST = "pc2-last", KEY_LANG = "pc-lang";
const ADVANCE_MS = 250;
// Reagyano's own booking and WhatsApp links, as used on metreagyano.nl (checked 25 Oct 2026).
const COACH_BOOKING = "https://calendly.com/reagyanologan/30min";
const COACH_WHATSAPP = "31616077153";
const ZONE_CLASS = ["ok", "warn", "bad"], ZONE_VAR = ["--ok", "--warn", "--bad"];

const $ = (id) => document.getElementById(id);
const app = $("app");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// localStorage: only pc2-last and pc-lang, never in workshop mode (shared phones).
function store(key, value) {
  if (WORKSHOP) return null;
  try {
    if (value === undefined) return JSON.parse(localStorage.getItem(key));
    localStorage.setItem(key, JSON.stringify(value));
    return value;
  } catch (e) { return null; }
}

const freshState = () => ({
  occupation: null,
  sources: params.get("ctx") === "sport" ? ["sport"] : [],
  heaviest: null,
  answers: Array(Engine.SIGNALS.length).fill(null),
  followups: {},
});

const urlLang = params.get("lang");
const ui = {
  lang: urlLang === "en" || urlLang === "nl" ? urlLang : store(KEY_LANG) === "en" ? "en" : "nl",
  s: freshState(),
  idx: 0,
  busy: false,
  prev: undefined, // last stored result, read once per check before saving the new one
  saved: false,
  recipient: null, // message recipient chosen on the result screen
  edits: {},       // messages the user changed, per recipient (or "checkin"), kept when switching
};
const T = () => TEXT[ui.lang];
const allAnswered = () => ui.s.answers.every((a) => a != null);

// ---------- screen list ----------
// Later screens depend on earlier answers only, so an index into this list stays valid when going back.
function screens() {
  const list = ["intro", "occupation", "sources"];
  if (Engine.needsHeaviest(ui.s)) list.push("heaviest");
  Engine.SIGNALS.forEach((_, i) => list.push(`sig:${i}`));
  if (allAnswered()) Engine.nextQuestions(ui.s).forEach((q) => list.push(`fu:${q}`));
  list.push("result");
  return list;
}

// Drop answers that no longer fit after an earlier answer changed (e.g. sport removed as a source).
function prune() {
  const s = ui.s;
  if (!Engine.needsHeaviest(s) || !s.sources.includes(s.heaviest)) s.heaviest = null;
  if (!allAnswered()) return;
  for (const q of Object.keys(s.followups)) {
    if (!Engine.optionsFor(q, s).includes(s.followups[q])) delete s.followups[q];
  }
}

function go(delta) {
  ui.idx = Math.max(0, Math.min(ui.idx + delta, screens().length - 1));
  if (screens()[ui.idx] === "result") enterResult();
  render(true);
}

function enterResult() {
  const r = Engine.result(ui.s);
  ui.recipient = r.talk.recipient || "friend";
  if (ui.prev === undefined) ui.prev = store(KEY_LAST);
  const date = new Date().toLocaleDateString(ui.lang === "nl" ? "nl-NL" : "en-GB", { day: "numeric", month: "long" });
  const rec = Engine.record(ui.s, date);
  ui.saved = (store(KEY_LAST, rec) || {}).zone === rec.zone;
}

// ---------- shared pieces ----------
// Zone gauge. With a zone, the other bands are dimmed and the own band lights up once the needle lands.
function gauge(pos, label, zone) {
  const cx = 120, cy = 124, r = 92, gap = 0.025;
  const seg = (z, a0, a1) => `<path class="seg${zone == null ? "" : z === zone ? " on" : " off"}" d="${arc(a0, a1)}" stroke="var(${ZONE_VAR[z]})" stroke-width="16" fill="none"/>`;
  const arc = (a0, a1) => {
    const p = (a) => [cx + r * Math.cos(a), cy - r * Math.sin(a)];
    const [x0, y0] = p(a0), [x1, y1] = p(a1);
    return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
  };
  const b1 = Math.PI * (2 / 3), b2 = Math.PI / 3;
  const ticks = Array.from({ length: 19 }, (_, i) => {
    const a = Math.PI * (1 - i / 18), long = i % 6 === 0, r1 = r - 16, r2 = r - (long ? 26 : 21);
    return `<line x1="${(cx + r1 * Math.cos(a)).toFixed(1)}" y1="${(cy - r1 * Math.sin(a)).toFixed(1)}" x2="${(cx + r2 * Math.cos(a)).toFixed(1)}" y2="${(cy - r2 * Math.sin(a)).toFixed(1)}" stroke="var(--muted)" stroke-width="${long ? 1.6 : 0.8}" opacity="${long ? 0.8 : 0.45}"/>`;
  }).join("");
  const deg = pos == null ? -62 : pos * 180 - 90;
  return `<svg class="gauge" viewBox="0 0 240 134" ${label ? `role="img" aria-label="${esc(label)}"` : 'aria-hidden="true"'}>
    ${seg(0, Math.PI, b1 + gap)}
    ${seg(1, b1 - gap, b2 + gap)}
    ${seg(2, b2 - gap, 0)}
    ${ticks}
    <g class="needle" style="transform: rotate(${pos == null ? deg : -90}deg)" data-deg="${deg}">
      <path d="M${cx - 4} ${cy} L${cx} ${cy - 78} L${cx + 4} ${cy} Z" fill="var(--ink)"/>
    </g>
    <circle cx="${cx}" cy="${cy}" r="9" fill="var(--ink)"/>
    <circle class="hub" cx="${cx}" cy="${cy}" r="3.5" fill="${zone == null ? "var(--accent)" : `var(${ZONE_VAR[zone]})`}"/>
  </svg>`;
}

function swingNeedle() {
  const n = app.querySelector(".needle[data-deg]");
  if (n) requestAnimationFrame(() => requestAnimationFrame(() => { n.style.transform = `rotate(${n.dataset.deg}deg)`; }));
}

function helpItems(keys) {
  const L = T().help.lines;
  return `<ul>${keys.map((k) => {
    const h = L[k];
    return `<li><b>${esc(h.name)}</b><span class="muted">${esc(h.desc)}</span>${h.num ? `<a class="num" href="tel:${h.num.replace(/\D/g, "")}">${h.num}</a>` : ""}${h.url ? `<a href="${h.url}" target="_blank" rel="noopener">${h.url.replace("https://www.", "")}</a>` : ""}</li>`;
  }).join("")}</ul>`;
}

// ---------- intro ----------
function viewIntro() {
  const L = T(), U = L.ui, prev = store(KEY_LAST);
  const prevLine = prev && typeof prev.zone === "number" && L.zoneNames[prev.zone] ? `<p class="hint">${esc(U.prev(L.zoneNames[prev.zone], prev.n2, prev.d))}</p>` : "";
  return `<section class="hero enter">
    <div class="stack">
      <div class="eyebrow">${esc(U.eyebrow)}</div>
      <h1 tabindex="-1">${esc(U.h1)}</h1>

    </div>
    <div class="panel gauge-card">
      ${gauge(null)}
      <div class="legend">${L.zoneNames.map((z, i) => `<div><b><span class="dot" style="background:var(${ZONE_VAR[i]})"></span>${esc(z)}</b><span class="muted">${esc(L.zoneShort[i])}</span></div>`).join("")}</div>
    </div>
    ${prevLine}
    <p class="hint">${esc(U.notDiagnosis)}</p>
    <div><button class="btn" type="button" data-action="next">${esc(U.start)} →</button></div>
  </section>`;
}

// ---------- question screens ----------
function questionFrame(body, answers) {
  const list = screens(), U = T().ui;
  const qs = list.filter((x) => x !== "intro" && x !== "result");
  const pos = qs.indexOf(list[ui.idx]) + 1;
  const total = qs.length + (allAnswered() ? 0 : 2); // follow-ups are unknown until all signals are answered
  const left = total - pos;
  return `<section class="q-screen enter">
    <div class="q-head">
      <div class="q-nav">
        <button class="back" type="button" data-action="back">← ${esc(U.back)}</button>
        <span class="count">${left > 0 && left <= 3 ? esc(U.timeLeft) : esc(U.questionOf(pos, total))}</span>
      </div>
      <div class="bar-progress" aria-hidden="true"><span style="width:${Math.round((pos / total) * 100)}%"></span></div>
    </div>
    <div class="q-body">${body}</div>
    ${answers}
  </section>`;
}

function choice(options, selected, levels) {
  return `<div class="answers" role="group">${options.map(([value, label], i) => `<button class="opt" type="button" data-pick="${esc(value)}" aria-pressed="${selected === value}">
    ${levels ? `<span class="lvl" aria-hidden="true">${[0, 1, 2].map((d) => `<i class="${d < i ? "on" : ""}"></i>`).join("")}</span>` : ""}${esc(label)}</button>`).join("")}</div>`;
}

function viewOccupation() {
  const L = T();

    choice(Object.entries(L.occupation.options), ui.s.occupation));
}

function viewSources() {

    `<div class="answers"><button class="btn block" type="button" data-action="next">${esc(U.next)} →</button></div>`);

function viewHeaviest() {

}

    choice(L.signals.scale.map((label, v) => [String(v), label]), ui.s.answers[i] == null ? null : String(ui.s.answers[i]), true));

function viewFollowup(q) {

// ---------- result ----------
function strategyText(id) {
  const L = T(), s = ui.s, base = L.strategies[id];
  const taak = (x) => x.replaceAll("{taak}", L.task[s.occupation] || L.task.hbo);
  let { t, w, d, k } = base;
  if (id === "strength" && L.strengthPlan[s.followups.strength]) ({ d, k } = L.strengthPlan[s.followups.strength]);
  const [kind, src, detail] = id.split(".");
  if (kind === "src" && !detail) w = L.sourceWhy[src][s.followups[`src.${src}`]] || "";
  return { t: taak(t), w: taak(w || ""), d: taak(d), k: taak(k) };
}

function message(recipient, topic) {
  const M = T().messages;
  return `${M.opener[recipient]} ${M.middle.replace("{topic}", M.topic[topic] || M.topic.generic)} ${M.ask[recipient]}`;
}

function messageBlock(topic) {
  const L = T(), M = L.messages, U = L.ui;
  return `<div class="recipients" role="group" aria-label="${esc(L.talk.switchLabel)}"><span class="label">${esc(L.talk.switchLabel)}</span>
      ${Object.keys(M.opener).map((r) => `<button class="pill" type="button" data-recipient="${r}" aria-pressed="${ui.recipient === r}">${esc(M.recipientLabel[r])}</button>`).join("")}</div>
    ${msgEditor(ui.recipient, message(ui.recipient, topic))}`;
}

// Editable message: change it before copying or sharing. "Deel" opens the phone's share sheet; nothing is
// sent until the user picks an app and a person.
function msgEditor(key, text) {
  const U = T().ui;
  return `<label class="hint" for="msg-text">${esc(U.messageLabel)}</label>

}

const SECTIONS = {

    return `<section class="stack"><p class="muted">${esc(r.case === "calm" ? L.again.calm : L.again.other)}</p>
      ${ui.saved ? `<p class="hint">${esc(U.saved)}</p>` : ""}
      <div><button class="btn" type="button" data-action="again">↺ ${esc(L.again.button)}</button></div></section>`;
  },
};

function viewResult() {
  const r = Engine.result(ui.s), U = T().ui;
  return `<div class="stack enter">
    <div class="q-nav"><button class="back" type="button" data-action="back">← ${esc(U.back)}</button></div>
    <h1 class="eyebrow" tabindex="-1">${esc(U.resultEyebrow)}</h1>
    ${r.layout.map((sec) => SECTIONS[sec.id](r, sec)).join("")}
  </div>`;
}

// ---------- dialogs ----------
function openHelp() {
  const H = T().help, U = T().ui;
  // Someone opening this mid-check may need help now: urgent order, fitted to the occupation if known.
  const list = ui.s.occupation
    ? Engine.helpList({ ...freshState(), occupation: ui.s.occupation, answers: Array(8).fill(3) })
    : ["113", "injebol", "kindertelefoon", "huisarts", "112"];
  const d = $("help-dialog");
  d.innerHTML = `<div class="dialog-head"><h2 id="help-dialog-h">${esc(H.h)}</h2><button class="btn ghost small" type="button" data-close>${esc(U.close)}</button></div>
    <div class="help stack"><p class="muted">${esc(H.p)}</p>${helpItems(list)}</div>`;
  d.showModal();
}

function openPlan(id) {
  const L = T(), U = L.ui, s = strategyText(id);
  const date = new Date().toLocaleDateString(ui.lang === "nl" ? "nl-NL" : "en-GB", { weekday: "long", day: "numeric", month: "long" });
  const d = $("plan-dialog");
  d.innerHTML = `<div class="plan-card">
      <div class="eyebrow" id="plan-dialog-h">${esc(U.planTitle)}</div>
      <p class="hint">${esc(U.planDate(date))}</p>
      <h2>${esc(s.t)}</h2>
      <dl class="todo"><dt>${esc(U.today)}</dt><dd>${esc(s.d)}</dd><dt>${esc(U.week)}</dt><dd>${esc(s.k)}</dd></dl>
      <div class="mark">Pressure Check · metReagyano</div>
    </div>
    <p class="hint" style="margin:12px 0">${esc(U.planHint)}</p>
    <div class="actions">${navigator.share ? `<button class="btn small" type="button" data-share="${esc(id)}">${esc(U.share)}</button>` : ""}<button class="btn ghost small" type="button" data-close>${esc(U.close)}</button></div>`;
  d.showModal();
}

// ---------- render ----------
const VIEWS = { intro: viewIntro, occupation: viewOccupation, sources: viewSources, heaviest: viewHeaviest, result: viewResult };

function render(moveFocus) {
  const L = T(), U = L.ui, id = screens()[ui.idx];
  document.documentElement.lang = ui.lang;
  $("lang-nl").setAttribute("aria-pressed", ui.lang === "nl");
  $("lang-en").setAttribute("aria-pressed", ui.lang === "en");
  $("lang").setAttribute("aria-label", U.language);
  $("open-help").textContent = U.helpLink;
  const [kind, arg] = id.split(/:(.*)/);
  app.dataset.screen = id;
  app.innerHTML = kind === "sig" ? viewSignal(+arg) : kind === "fu" ? viewFollowup(arg) : VIEWS[id]();
  $("foot").hidden = id !== "intro" && id !== "result"; // question screens keep the answers in the thumb zone
  $("foot").innerHTML = `<span>${esc(U.madeBy)} <a href="https://www.metreagyano.nl" target="_blank" rel="noopener">metReagyano</a> · ${esc(U.version)}</span><span>${esc(U.privacy)}</span>`;
  if (id === "result") swingNeedle();
  if (moveFocus) {
    window.scrollTo({ top: 0 });
    app.querySelector("[tabindex='-1']")?.focus({ preventScroll: true });
    const count = app.querySelector(".count");
    $("live").textContent = count ? count.textContent : "";
  }
}

// ---------- events ----------
function pick(value) {
  const s = ui.s, id = screens()[ui.idx];
  const [kind, arg] = id.split(/:(.*)/);
  if (id === "occupation") s.occupation = value;
  else if (id === "heaviest") s.heaviest = value;
  else if (kind === "sig") s.answers[+arg] = +value;
  else if (kind === "fu") s.followups[arg] = value;
  prune();
}

app.addEventListener("click", async (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  if (btn.dataset.pick != null) {
    if (ui.busy) return;
    ui.busy = true;
    app.querySelectorAll(".opt").forEach((b) => b.setAttribute("aria-pressed", b === btn));
    pick(btn.dataset.pick);
    setTimeout(() => { ui.busy = false; go(1); }, ADVANCE_MS);
    return;
  }
  if (btn.dataset.recipient) {
    ui.recipient = btn.dataset.recipient;
    const r = Engine.result(ui.s);
    const box = $("msg-text");
    box.value = ui.edits[ui.recipient] ?? message(ui.recipient, r.talk.topic);
    box.dataset.key = ui.recipient;
    app.querySelectorAll("[data-recipient]").forEach((b) => b.setAttribute("aria-pressed", b === btn));
    $("copied").textContent = "";
    return;
  }
  if (btn.dataset.copy) {
    const el = $(btn.dataset.copy), out = $("copied");
    try { await navigator.clipboard.writeText(el.value); out.textContent = "✓ " + T().ui.copied; }
    catch (err) { el.focus(); el.select(); out.textContent = T().ui.copyFail; }
    return;
  }
  if (btn.dataset.shareMsg != null) {
    try { await navigator.share({ text: $("msg-text").value }); } catch (err) { /* cancelled */ }
    return;
  }
  if (btn.dataset.plan) return openPlan(btn.dataset.plan);
  const action = btn.dataset.action;
  if (action === "next") go(1);
  if (action === "back") go(-1);
  if (action === "again") { ui.s = freshState(); ui.idx = 0; ui.saved = false; ui.prev = undefined; ui.edits = {}; render(true); }
});

app.addEventListener("input", (e) => {
  if (e.target.id === "msg-text") ui.edits[e.target.dataset.key] = e.target.value;
});

app.addEventListener("change", (e) => {
  const id = e.target.dataset.source;
  if (!id) return;
  const s = ui.s;
  if (e.target.checked) s.sources = id === "unknown" ? ["unknown"] : [...s.sources.filter((x) => x !== "unknown"), id];
  else s.sources = s.sources.filter((x) => x !== id);
  prune();
  app.querySelectorAll("[data-source]").forEach((cb) => { cb.checked = s.sources.includes(cb.dataset.source); });
});

for (const d of [$("help-dialog"), $("plan-dialog")]) {
  d.addEventListener("click", async (e) => {
    if (e.target === d || e.target.closest("[data-close]")) return d.close();
    const share = e.target.closest("[data-share]");
    if (share) {
      const s = strategyText(share.dataset.share), U = T().ui;
      try { await navigator.share({ title: U.planTitle, text: `${s.t}\n${U.today}: ${s.d}\n${U.week}: ${s.k}` }); } catch (err) { /* cancelled */ }
    }
  });
}

$("open-help").addEventListener("click", openHelp);
for (const lang of ["nl", "en"]) {
  $(`lang-${lang}`).addEventListener("click", () => { ui.lang = lang; store(KEY_LANG, lang); render(false); });
}

render(false);

</script>
</body>
</html>
